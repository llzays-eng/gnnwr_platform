# GNNWR 平台 monorepo：API + Workers + 前端 + PostGIS/Redis/MinIO
# 可选：docker compose --profile extras up  启动 GeoServer
# 安全（P1-6）：PostGIS / Redis / MinIO 只在 compose 内部网络可达，不映射宿主机端口；
#   口令没有默认值，未在 .env 设置时 compose 直接报错。本地开发需要从宿主机连接时：
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgis redis minio
services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gnnwr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gnnwr_platform}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gnnwr}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 设置 REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?请在 .env 设置 REDIS_PASSWORD}
    # 口令从环境变量读，避免写进 compose 文件；$$ 让 compose 不做插值，交给容器内 sh 展开
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # 官方 minio/minio 镜像已从 Docker Hub / quay.io 下架；改用社区延续版 SILO（pgsty/minio），
    # 命令与环境变量与原版一致。固定版本，升级时手动改 tag。
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?请在 .env 设置 MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?请在 .env 设置 MINIO_SECRET_KEY}
    volumes: [minio_data:/data]

  geoserver:
    profiles: ["extras"]
    image: docker.osgeo.org/geoserver:2.25.2
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_PASSWORD:-geoserver}
    volumes: [geoserver_data:/opt/geoserver_data]
    # 默认口令 admin/geoserver，仅绑定本机回环；对外提供前请改 GEOSERVER_PASSWORD
    ports: ["127.0.0.1:8080:8080"]

  api:
    build: ./backend
    environment: &app_env
      POSTGRES_HOST: postgis
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-gnnwr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gnnwr_platform}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 设置 REDIS_PASSWORD}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?请在 .env 设置 MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?请在 .env 设置 MINIO_SECRET_KEY}
      MINIO_BUCKET: gnnwr
      LOCAL_STORAGE_DIR: /data/gnnwr-storage
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      # 非 DEBUG 下占位符会被 API 拒绝启动；这里不给默认值，缺失时 compose 直接报错而不是 api 反复重启
      SECRET_KEY: ${SECRET_KEY:?请在 .env 设置 SECRET_KEY（openssl rand -hex 32）}
      ENGINE_BACKEND: ${ENGINE_BACKEND:-gnnwr_lite}
      SURFACE_TILE_CRS: GCJ02
      VECTOR_OUTPUT_CRS: WGS84
      DEBUG: ${DEBUG:-false}
      WS_REQUIRE_AUTH: ${WS_REQUIRE_AUTH:-true}
      ALLOW_INLINE_JOBS: ${ALLOW_INLINE_JOBS:-false}
      TILE_TOKEN_EXPIRE_MINUTES: ${TILE_TOKEN_EXPIRE_MINUTES:-60}
    volumes:
      - gnnwr_storage:/data/gnnwr-storage
    depends_on:
      postgis: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["8000:8000"]

  worker-cpu:
    build: ./backend
    command: celery -A app.tasks.celery_app.celery_app worker -Q cpu_queue -c 4 --loglevel=info
    environment: *app_env
    volumes:
      - gnnwr_storage:/data/gnnwr-storage
    depends_on:
      postgis: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker-gpu:
    build: ./backend
    command: celery -A app.tasks.celery_app.celery_app worker -Q gpu_queue -c 1 --loglevel=info
    environment: *app_env
    volumes:
      - gnnwr_storage:/data/gnnwr-storage
    depends_on:
      postgis: {condition: service_healthy}
      redis: {condition: service_healthy}

  frontend:
    build:
      context: ./frontend
      args:
        # 浏览器从宿主机访问时直连 API；若只走 nginx 同源反代可留空
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-}
        VITE_AMAP_KEY: ${VITE_AMAP_KEY:-}
        VITE_AMAP_SECURITY_CODE: ${VITE_AMAP_SECURITY_CODE:-}
        VITE_ENABLE_MOCK: ${VITE_ENABLE_MOCK:-false}
        VITE_MOCK_ASSUME_PENDING_CONTRACTS: ${VITE_MOCK_ASSUME_PENDING_CONTRACTS:-false}
    depends_on: [api]
    ports: ["5173:80"]

volumes:
  pg_data:
  minio_data:
  geoserver_data:
  gnnwr_storage:
