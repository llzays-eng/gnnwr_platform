<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GNNWR / GTNNWR 时空智能分析 · 结果看板</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#141a21; --panel2:#0f151b; --line:#222b35; --line-soft:#1a222b;
    --text:#e6edf3; --muted:#93a1b0; --faint:#657081;
    --accent:#34D1BE; --accent-soft:rgba(52,209,190,.12);
    --neg:#4e93de; --pos:#eb7a54; --warn:#e2b04a;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:
      radial-gradient(1200px 600px at 78% -8%,rgba(52,209,190,.08),transparent 60%),
      var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;
      -webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  .mono{font-family:var(--mono)}
  header{padding:20px 26px 0;max-width:1360px;margin:0 auto}
  .title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .title h1{font-size:19px;font-weight:620;margin:0;letter-spacing:.2px}
  .title .sub{color:var(--faint);font-size:12px}
  .tag{font-size:10.5px;color:var(--accent);border:1px solid var(--accent);
       border-radius:20px;padding:2px 9px;font-family:var(--mono)}
  .tabs{display:flex;gap:8px;margin:16px 0 0;border-bottom:1px solid var(--line)}
  .tab{padding:9px 15px;cursor:pointer;color:var(--muted);font-size:13px;
       border-bottom:2px solid transparent;margin-bottom:-1px;transition:.12s}
  .tab:hover{color:var(--text)}
  .tab.on{color:var(--accent);border-bottom-color:var(--accent)}
  .tab small{display:block;font-size:10px;color:var(--faint);font-family:var(--mono);margin-top:1px}
  main{max-width:1360px;margin:0 auto;padding:18px 26px 40px;
       display:grid;grid-template-columns:1fr 380px;gap:16px}
  @media(max-width:1000px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .hd{padding:13px 16px;border-bottom:1px solid var(--line-soft);
      display:flex;align-items:center;justify-content:space-between;gap:10px}
  .hd h3{margin:0;font-size:13.5px;font-weight:560}
  .hd .hint{font-size:11px;color:var(--faint);font-family:var(--mono)}
  .bd{padding:14px 16px}

  /* toolbar */
  .toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
           padding:12px 16px;border-bottom:1px solid var(--line-soft)}
  .fld{display:flex;align-items:center;gap:7px}
  .fld label{font-size:11.5px;color:var(--muted)}
  select{background:var(--panel2);color:var(--text);border:1px solid var(--line);
         border-radius:7px;padding:6px 9px;font-size:12.5px;font-family:var(--sans);cursor:pointer}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .seg button{background:var(--panel2);color:var(--muted);border:0;padding:6px 12px;
              font-size:12px;cursor:pointer;font-family:var(--sans)}
  .seg button.on{background:var(--accent-soft);color:var(--accent)}

  /* map */
  .mapwrap{position:relative;background:
      linear-gradient(0deg,#0a0e13,#0c1116);padding:10px}
  canvas{display:block;width:100%;border-radius:8px}
  #tip{position:absolute;pointer-events:none;background:rgba(8,12,16,.96);
       border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11.5px;
       font-family:var(--mono);color:var(--text);opacity:0;transition:opacity .1s;
       transform:translate(-50%,-115%);white-space:nowrap;z-index:5;box-shadow:0 6px 24px rgba(0,0,0,.5)}
  .cbar-wrap{display:flex;align-items:center;gap:10px;margin-left:auto}
  .cbar{width:170px;height:11px;border-radius:6px;border:1px solid var(--line)}
  .cbar-lab{font-size:10.5px;font-family:var(--mono);color:var(--faint)}

  /* time slider */
  .timebar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line-soft)}
  .play{width:34px;height:34px;border-radius:50%;border:1px solid var(--accent);background:var(--accent-soft);
        color:var(--accent);cursor:pointer;font-size:13px;display:grid;place-items:center;flex:0 0 auto}
  input[type=range]{-webkit-appearance:none;appearance:none;height:5px;border-radius:4px;
        background:var(--line);flex:1;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
        background:var(--accent);cursor:pointer;box-shadow:0 0 0 3px var(--accent-soft)}
  .tlabel{font-family:var(--mono);font-size:12px;color:var(--accent);min-width:96px;text-align:right}

  .note{padding:11px 16px;font-size:11.5px;color:var(--faint);line-height:1.65;
        border-top:1px solid var(--line-soft);background:var(--panel2)}
  .note b{color:var(--muted);font-weight:560}
  .kbd{font-family:var(--mono);color:var(--accent);background:var(--accent-soft);
       padding:1px 5px;border-radius:4px}

  /* metrics */
  .metrics-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .m{background:var(--panel2);border:1px solid var(--line-soft);border-radius:9px;padding:11px 8px;text-align:center}
  .m .v{font-size:19px;font-weight:640;font-family:var(--mono);color:var(--accent)}
  .m .k{font-size:10.5px;color:var(--faint);margin-top:2px;font-family:var(--mono)}
  .bars{margin-top:6px}
  .bar-row{display:grid;grid-template-columns:78px 1fr 52px;align-items:center;gap:9px;padding:5px 0}
  .bar-row .name{font-size:11.5px;color:var(--muted);font-family:var(--mono);text-align:right}
  .bar-row .name.hl{color:var(--accent);font-weight:600}
  .track{height:15px;background:var(--panel2);border-radius:5px;overflow:hidden;border:1px solid var(--line-soft)}
  .fill{height:100%;border-radius:5px;background:linear-gradient(90deg,#2a6f66,var(--accent))}
  .fill.dim{background:linear-gradient(90deg,#2b3540,#4a5765)}
  .bar-row .val{font-size:11.5px;font-family:var(--mono);color:var(--muted);text-align:right}
  .insight{margin-top:4px;font-size:12px;color:var(--muted);line-height:1.7;
           border-left:2px solid var(--accent);padding:2px 0 2px 12px}
  .insight b{color:var(--text)}
  .foot{max-width:1360px;margin:0 auto;padding:0 26px 30px;color:var(--faint);font-size:11px;line-height:1.7}
</style>
</head>
<body>
<header>
  <div class="title">
    <h1>GNNWR / GTNNWR 时空智能分析云平台</h1>
    <span class="tag">结果看板 · Demo</span>
    <span class="sub">零依赖离线版 —— 数据来自本平台 numpy 引擎的真实训练输出</span>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<main>
  <!-- 左：地图 -->
  <section class="card">
    <div class="toolbar">
      <div class="fld">
        <label>局部回归系数</label>
        <select id="varSel"></select>
      </div>
      <div class="seg" id="modeSeg">
        <button data-mode="coef" class="on">系数分布</button>
        <button data-mode="resid">残差诊断</button>
      </div>
      <div class="cbar-wrap">
        <span class="cbar-lab" id="cbarLo">–</span>
        <div class="cbar" id="cbar"></div>
        <span class="cbar-lab" id="cbarHi">+</span>
      </div>
    </div>
    <div class="mapwrap">
      <canvas id="map"></canvas>
      <div id="tip"></div>
    </div>
    <div class="timebar" id="timebar" style="display:none">
      <button class="play" id="play">▶</button>
      <input type="range" id="tslider" min="0" max="0" value="0" />
      <span class="tlabel" id="tlabel">第 0 天</span>
    </div>
    <div class="note" id="mapnote"></div>
  </section>

  <!-- 右：精度与训练 -->
  <aside style="display:flex;flex-direction:column;gap:16px">
    <div class="card">
      <div class="hd"><h3>模型精度（测试集）</h3><span class="hint" id="mtype"></span></div>
      <div class="bd">
        <div class="metrics-row" id="metrics"></div>
      </div>
    </div>

    <div class="card">
      <div class="hd"><h3>训练收敛曲线</h3><span class="hint">train / val loss</span></div>
      <div class="bd"><canvas id="loss" style="height:150px"></canvas></div>
    </div>

    <div class="card">
      <div class="hd"><h3>与基线模型对比</h3><span class="hint">R² 越高越好</span></div>
      <div class="bd">
        <div class="bars" id="bars"></div>
        <div class="insight" id="insight"></div>
      </div>
    </div>
  </aside>
</main>

<div class="foot" id="foot"></div>

<script>
const DATA = /*__DATA__*/{};
</script>
<script>
// ============ 色标（与前端 colormap.ts 一致） ============
const NEG=[78,147,222], MIDN=[70,84,99], POS=[235,122,84];
const SEQ0=[36,64,80], SEQ1=[52,209,190];
const RNEG=[80,150,235], RMID=[60,72,86], RPOS=[233,110,90]; // 残差发散
const lerp=(a,b,t)=>a+(b-a)*t;
const hex=c=>'#'+c.map(x=>Math.round(Math.max(0,Math.min(255,x))).toString(16).padStart(2,'0')).join('');
function colorFor(v,lo,hi,spans0,pal){
  const N=pal?pal[0]:NEG, M=pal?pal[1]:MIDN, P=pal?pal[2]:POS;
  if(spans0){
    const m=Math.max(Math.abs(lo),Math.abs(hi))||1, t=Math.max(-1,Math.min(1,v/m));
    if(t<0){const k=t+1;return hex([lerp(N[0],M[0],k),lerp(N[1],M[1],k),lerp(N[2],M[2],k)]);}
    return hex([lerp(M[0],P[0],t),lerp(M[1],P[1],t),lerp(M[2],P[2],t)]);
  }
  const t=Math.max(0,Math.min(1,(v-lo)/((hi-lo)||1)));
  return hex([lerp(SEQ0[0],SEQ1[0],t),lerp(SEQ0[1],SEQ1[1],t),lerp(SEQ0[2],SEQ1[2],t)]);
}
function cbarGrad(lo,hi,spans0,pal){
  const n=24,s=[];for(let i=0;i<=n;i++){const v=lo+(hi-lo)*i/n;
    s.push(colorFor(v,lo,hi,spans0,pal)+' '+(100*i/n).toFixed(0)+'%');}
  return 'linear-gradient(90deg,'+s.join(',')+')';
}
function robustRange(vals){
  const s=[...vals].sort((a,b)=>a-b);
  const q=p=>s[Math.max(0,Math.min(s.length-1,Math.floor(p*(s.length-1))))];
  return [q(0.02),q(0.98)];
}
const LAB={intercept:'截距',area:'建筑面积',age:'楼龄',floor_ratio:'容积率',green_ratio:'绿化率',
  dist_subway:'地铁邻近性',dist_cbd:'到CBD距离',school_score:'学区评分',poi_density:'POI密度',
  aod:'气溶胶AOD',temp:'气温',humidity:'相对湿度',wind:'风速',blh:'边界层高度',dem:'高程',ntl:'夜间灯光'};
const lab=k=>LAB[k]||k;

// ============ 状态 ============
let cur='housing_price', curVar='intercept', mode='coef', curTime=0, playing=null;

// ============ DOM ============
const $=id=>document.getElementById(id);
const canvas=$('map'), ctx=canvas.getContext('2d');
const lossC=$('loss'), lctx=lossC.getContext('2d');

// ============ 初始化 tabs ============
const scenMeta={housing_price:{name:'城市住宅价格',tag:'GNNWR·空间'},
                air_quality:{name:'大气污染物 PM2.5',tag:'GTNNWR·时空'}};
$('tabs').innerHTML=Object.keys(DATA).map(k=>
  `<div class="tab ${k===cur?'on':''}" data-k="${k}">${scenMeta[k].name}<small>${scenMeta[k].tag}</small></div>`).join('');
$('tabs').querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  cur=t.dataset.k; document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  curTime=0; stopPlay(); initScenario();
});

function initScenario(){
  const d=DATA[cur];
  // 变量下拉
  $('varSel').innerHTML=d.columns.map(c=>`<option value="${c}">${lab(c)}</option>`).join('');
  curVar=d.columns.includes('intercept')?(d.columns.find(c=>c!=='intercept')||'intercept'):d.columns[0];
  // 默认选一个有代表性的变量
  if(cur==='housing_price'&&d.columns.includes('green_ratio')) curVar='green_ratio';
  if(cur==='air_quality'&&d.columns.includes('aod')) curVar='aod';
  $('varSel').value=curVar;
  $('varSel').onchange=()=>{curVar=$('varSel').value;draw();};
  // 时间轴
  const tb=$('timebar');
  if(d.temporal&&d.times.length){
    tb.style.display='flex';
    const sl=$('tslider'); sl.min=0; sl.max=d.times.length-1; sl.value=0;
    sl.oninput=()=>{curTime=+sl.value;updateTLabel();draw();};
    updateTLabel();
  }else tb.style.display='none';
  renderMetrics(); renderLoss(); renderBars(); renderNote();
  draw();
}
function updateTLabel(){const d=DATA[cur];$('tlabel').textContent='第 '+d.times[curTime]+' 天';}

// ============ 模式切换 ============
$('modeSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  mode=b.dataset.mode; $('modeSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  $('varSel').parentElement.style.opacity = mode==='resid'?.4:1;
  $('varSel').disabled = mode==='resid';
  draw();
});

// ============ 播放 ============
$('play').onclick=()=>playing?stopPlay():startPlay();
function startPlay(){const d=DATA[cur];if(!d.temporal)return;$('play').textContent='❚❚';
  playing=setInterval(()=>{curTime=(curTime+1)%d.times.length;$('tslider').value=curTime;updateTLabel();draw();},650);}
function stopPlay(){if(playing){clearInterval(playing);playing=null;}$('play').textContent='▶';}

// ============ 主绘制：系数/残差散点地图 ============
function draw(){
  const d=DATA[cur];
  const W=canvas.clientWidth||760, H=Math.round(W*0.62);
  const dpr=window.devicePixelRatio||1;
  canvas.width=W*dpr; canvas.height=H*dpr; canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);

  // 当前时间片的点
  let pts=d.points;
  if(d.temporal) pts=pts.filter(p=>p.time===d.times[curTime]);

  // 取值 & 色标范围（对系数：按全体时间片统一范围，动画才可比）
  const valOf=p=> mode==='resid'? p.residual : p.coef[curVar];
  let scaleVals;
  if(mode==='resid') scaleVals=d.points.map(p=>p.residual);
  else scaleVals=d.points.map(p=>p.coef[curVar]);
  let [lo,hi]=robustRange(scaleVals);
  const spans0 = mode==='resid' ? true : (lo<0&&hi>0);
  if(spans0){const m=Math.max(Math.abs(lo),Math.abs(hi));lo=-m;hi=m;}
  const pal = mode==='resid'?[RNEG,RMID,RPOS]:null;

  // 经纬度范围 -> 画布，留边
  const lons=d.points.map(p=>p.lon), lats=d.points.map(p=>p.lat);
  const x0=Math.min(...lons),x1=Math.max(...lons),y0=Math.min(...lats),y1=Math.max(...lats);
  const pad=46, mapW=W-pad*2, mapH=H-pad*2;
  const sx=lon=>pad+(lon-x0)/((x1-x0)||1)*mapW;
  const sy=lat=>pad+(1-(lat-y0)/((y1-y0)||1))*mapH;

  // 背景网格
  ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1;
  for(let i=0;i<=6;i++){const gx=pad+mapW*i/6;ctx.beginPath();ctx.moveTo(gx,pad);ctx.lineTo(gx,pad+mapH);ctx.stroke();
    const gy=pad+mapH*i/6;ctx.beginPath();ctx.moveTo(pad,gy);ctx.lineTo(pad+mapW,gy);ctx.stroke();}

  // 点
  const R = pts.length>600?3.2:(pts.length>200?4.2:6.2);
  _pts=[]; // for hover
  pts.forEach(p=>{
    const cx=sx(p.lon),cy=sy(p.lat),v=valOf(p);
    ctx.beginPath();ctx.arc(cx,cy,R,0,7);
    ctx.fillStyle=colorFor(v,lo,hi,spans0,pal);
    ctx.globalAlpha=.9;ctx.fill();ctx.globalAlpha=1;
    ctx.lineWidth=.6;ctx.strokeStyle='rgba(0,0,0,.35)';ctx.stroke();
    _pts.push({cx,cy,p,v});
  });

  // 坐标标注
  ctx.fillStyle='rgba(147,161,176,.6)';ctx.font='10px '+getComputedStyle(document.body).fontFamily;
  ctx.fillText('经度 '+x0.toFixed(2)+'°',pad,H-16);
  ctx.textAlign='right';ctx.fillText(x1.toFixed(2)+'°',W-pad,H-16);ctx.textAlign='left';
  ctx.save();ctx.translate(16,pad);ctx.rotate(-Math.PI/2);ctx.textAlign='right';
  ctx.fillText('纬度 '+y0.toFixed(2)+'°',0,0);ctx.restore();

  // 更新色标
  $('cbar').style.background=cbarGrad(lo,hi,spans0,pal);
  $('cbarLo').textContent=lo.toFixed(2);
  $('cbarHi').textContent='+'+hi.toFixed(2);
}
let _pts=[];

// hover tooltip
canvas.onmousemove=e=>{
  const r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  let best=null,bd=1e9;
  for(const q of _pts){const dd=(q.cx-mx)**2+(q.cy-my)**2;if(dd<bd){bd=dd;best=q;}}
  const tip=$('tip');
  if(best&&bd<220){
    const d=DATA[cur];
    let html= mode==='resid'
      ? `残差 = ${best.v.toFixed(3)}`
      : `${lab(curVar)} 系数 = ${best.v.toFixed(3)}`;
    html+=`<br>经纬度 (${best.p.lon.toFixed(3)}, ${best.p.lat.toFixed(3)})`;
    if(d.temporal) html+=`<br>第 ${best.p.time} 天`;
    tip.innerHTML=html; tip.style.left=best.cx+'px'; tip.style.top=best.cy+'px'; tip.style.opacity=1;
  }else tip.style.opacity=0;
};
canvas.onmouseleave=()=>$('tip').style.opacity=0;

// ============ 指标 ============
function renderMetrics(){
  const d=DATA[cur],m=d.metrics;
  $('mtype').textContent=d.model_type;
  const items=[['R²',m.r2],['RMSE',m.rmse],['MAE',m.mae],['AICc',m.aicc]];
  $('metrics').innerHTML=items.map(([k,v])=>
    `<div class="m"><div class="v">${v}</div><div class="k">${k}</div></div>`).join('');
}

// ============ loss 曲线 ============
function renderLoss(){
  const d=DATA[cur],tr=d.history.train_loss,va=d.history.val_loss;
  const W=lossC.clientWidth||340,H=150,dpr=window.devicePixelRatio||1;
  lossC.width=W*dpr;lossC.height=H*dpr;lossC.style.height=H+'px';
  lctx.setTransform(dpr,0,0,dpr,0,0);lctx.clearRect(0,0,W,H);
  const all=tr.concat(va),lo=Math.min(...all),hi=Math.max(...all),pad=26;
  const sx=i=>pad+i/((tr.length-1)||1)*(W-pad*1.3);
  const sy=v=>pad*0.5+(1-(v-lo)/((hi-lo)||1))*(H-pad*1.6);
  // 轴
  lctx.strokeStyle='rgba(255,255,255,.08)';lctx.lineWidth=1;
  lctx.beginPath();lctx.moveTo(pad,pad*0.5);lctx.lineTo(pad,H-pad);lctx.lineTo(W-6,H-pad);lctx.stroke();
  const line=(arr,col)=>{lctx.strokeStyle=col;lctx.lineWidth=1.8;lctx.beginPath();
    arr.forEach((v,i)=>{i?lctx.lineTo(sx(i),sy(v)):lctx.moveTo(sx(i),sy(v));});lctx.stroke();};
  line(tr,'#34D1BE'); line(va,'#e2b04a');
  lctx.font='10px monospace';
  lctx.fillStyle='#34D1BE';lctx.fillText('train',W-64,16);
  lctx.fillStyle='#e2b04a';lctx.fillText('val',W-64,30);
  lctx.fillStyle='#657081';
  lctx.fillText(hi.toFixed(2),4,pad*0.5+4);lctx.fillText(lo.toFixed(2),4,H-pad);
  lctx.fillText('epoch',W/2-14,H-8);
}

// ============ 基线对比 bar ============
function renderBars(){
  const d=DATA[cur];
  const rows=[{method:d.model_type,r2:d.metrics.r2,hl:true},
              ...d.baselines.map(b=>({method:b.method,r2:b.r2,hl:false}))];
  rows.sort((a,b)=>b.r2-a.r2);
  const max=Math.max(...rows.map(r=>r.r2));
  $('bars').innerHTML=rows.map(r=>`
    <div class="bar-row">
      <div class="name ${r.hl?'hl':''}">${r.method}</div>
      <div class="track"><div class="fill ${r.hl?'':'dim'}" style="width:${(r.r2/max*100).toFixed(1)}%"></div></div>
      <div class="val">${r.r2.toFixed(3)}</div>
    </div>`).join('');
  // 洞见
  const ols=d.baselines.find(b=>b.method==='OLS');
  const gap=ols?((d.metrics.r2-ols.r2)*100).toFixed(1):'—';
  $('insight').innerHTML= cur==='housing_price'
    ? `<b>${d.model_type}</b> 的 R² 比全局 <b>OLS</b> 高 <b>${gap} 个百分点</b>。关键在于它给出的是<b>随位置变化</b>的系数——试试把左侧变量切到「容积率」或「绿化率」，能直接看到系数在城市不同片区<b>正负翻转</b>，这是全局回归无法表达的空间非平稳。`
    : `<b>${d.model_type}</b> 的 R² 比 <b>OLS</b> 高 <b>${gap} 个百分点</b>，也优于 GWR/GTWR。点击 ▶ 播放时间轴，可见 <b>AOD→PM2.5</b> 的转换系数在城市高于郊野，并在第 8 天冷锋过境后整体下降——空间与时间双重非平稳。`;
}

// ============ 说明 ============
function renderNote(){
  const d=DATA[cur];
  $('mapnote').innerHTML= mode==='resid'
    ? `每个点的颜色表示模型<b>残差</b>（观测−预测）。残差在空间上若成片同号，提示该片区仍有未被解释的结构；均匀近零则说明拟合良好。`
    : (cur==='housing_price'
      ? `每个点是一处房源，颜色表示该位置<b>${lab(curVar)}</b>的<b>局部回归系数</b>。<span class="kbd">全局 OLS 系数 = ${d.beta_ols[curVar]??'—'}</span>——GNNWR 把这一个数变成了一整片随空间变化的系数场。`
      : `每个点是一个监测站×某一天，颜色表示该时空位置<b>${lab(curVar)}</b>的<b>局部回归系数</b>。<span class="kbd">全局 OLS 系数 = ${d.beta_ols[curVar]??'—'}</span>。拖动下方时间轴或点 ▶ 观察系数的时空演变。`);
  $('foot').innerHTML=`看板数据由本平台 <span class="mono">engine/</span> 的 numpy 版 GNNWR/GTNNWR 引擎真实训练导出（非预设数值）；`+
    `合成数据用于离线演示，真实上线时替换为 RESDC/环境监测总站/住建网签等数据源，下游看板无需改动。`+
    `<br>${d.meta.note}`;
}

// resize
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{draw();renderLoss();},150);});

initScenario();
</script>
