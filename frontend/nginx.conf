# 前端容器内 Nginx：静态 SPA + 反代 API（含 WebSocket 升级）
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST + WebSocket 统一反代到 FastAPI（compose 内主机名 api）
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;   # 训练 WS 长连接
        client_max_body_size 200m;  # 大数据文件上传
    }

    # 独立看板（构建期拷入 public/）
    location = /dashboard.html { try_files /dashboard.html =404; }
}
